[workspace]
resolver = "3"
members = ["crates/quiz-core", "crates/quiz-cli", "crates/quiz-app", "crates/quiz-store"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
quiz-core = { path = "crates/quiz-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
