name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TRUNK_VERSION: v0.22.1

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"

      - name: Test
        run: cargo test --workspace --locked

      - name: Check the workshop themes
        run: cargo run -q --locked -p quiz-cli -- index

      - name: Build
        working-directory: crates/quiz-app
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './crates/quiz-app/dist'

  deploy_site:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
